[package]
name = "uf-dshot"
version = "0.1.0"
edition = "2021"
authors = ["Mykola Novik <nickolainovik@gmail.com>"]
license = "Apache-2.0"


rust-version = "1.91.1"
description = "no_std library to encode DShot commands and decode bidirectional DShot telemetry for any MCU, with Embassy STM32 support for DShot and bidirectional DShot."
categories = ["embedded", "no-std"]
homepage = "https://github.com/jettify/uf-dshot"
repository = "https://github.com/jettify/uf-dshot"
readme = "README.md"
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/src/**",
  "/tests/**",
  "/examples/**/*.rs",
]

keywords = ["dshot", "dshot300", "dshot600", "embassy"]

[dependencies]
defmt = { version = "1.0.1", optional = true }
embassy-sync = { version = "0.8.0", optional = true }
embassy-time = { version = "0.5.0", optional = true }

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
embassy-stm32-hal = { package = "embassy-stm32", version = "0.6.0", default-features = false, optional = true }

[features]
default = []
"defmt" = ["dep:defmt"]
"embassy-stm32" = [
  "dep:embassy-stm32-hal",
  "dep:embassy-sync",
  "dep:embassy-time",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
